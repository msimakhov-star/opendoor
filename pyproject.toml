[project]
name = "opendoor"
version = "0.1.0"
description = "Open Door: an agent that reads every GP surgery website in an area and shows which ones ask new patients for documents the NHS says are not needed."
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal>=1.5",
    "pydantic-ai-slim[google]>=2.45",
    "logfire>=5.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "certifi",
]

[tool.uv]
package = false
